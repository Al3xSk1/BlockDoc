[project]
name = "blockdoc"
version = "0.1.0"
description = "A fast, minimal Minecraft knowledge base built with MkDocs Material."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alex", email = "alex@kovalskitech.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.8.0,<10",
    "mkdocs-minify-plugin>=0.8.0,<0.9",
    "mkdocs-wikilinks-plugin>=0.1.3,<0.2",
    "obsidian-callouts>=1.0.1,<2",
    "pymdown-extensions>=11.0.1,<12",
]
test = ["playwright>=1.56,<2"]

[project.scripts]
blockdoc = "blockdoc:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
